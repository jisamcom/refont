<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shot.css"></head>
<body><div class="frame">
  <div class="panel">
    <span class="eyebrow">세밀한 조정 · 실시간</span>
    <div class="headline">크기·굵기·자간<br><span class="hl">실시간으로</span> 조절</div>
    <div class="sub">슬라이더를 움직이면 현재 페이지에 바로 반영됩니다.</div>
    <div class="bul">
      <div><span class="dot"></span>최소 글자 크기 · 줄간격 · 제목 굵기 유지</div>
      <div><span class="dot"></span>가변 폰트 축 (opsz · wdth …) 직접 입력</div>
      <div><span class="dot"></span>한 번에 기본값으로 초기화</div>
    </div>
  </div>
  <div class="stagecol">
    <div class="popup">
      <div class="pop-head"><img src="../../public/icons/icon-128.png" alt=""><span class="nm">Re<b>font</b></span><span class="toggle"></span></div>
      <div class="body">
        <div class="specimen">
          <div class="sk" style="font-family:'Malgun Gothic',sans-serif;font-weight:700">또렷하게 읽히는 본문</div>
          <div class="se" style="font-family:'Malgun Gothic',sans-serif">Adjust size, weight &amp; spacing</div>
          <div class="sn" style="font-family:'Malgun Gothic',sans-serif">0123456789</div>
        </div>
        <div class="row"><span class="lab">크기</span><span class="track"><span class="fill" style="width:48%"></span><span class="knob" style="left:48%"></span></span><span class="val">1.20×</span></div>
        <div class="row"><span class="lab">굵기</span><span class="track"><span class="fill" style="width:62%"></span><span class="knob" style="left:62%"></span></span><span class="val">600</span></div>
        <div class="row"><span class="lab">줄간격</span><span class="track"><span class="fill" style="width:55%"></span><span class="knob" style="left:55%"></span></span><span class="val">1.70</span></div>
        <div class="row"><span class="lab">자간</span><span class="track"><span class="fill" style="width:30%"></span><span class="knob" style="left:30%"></span></span><span class="val">0.3px</span></div>
        <div>
          <div class="sec-h"><span class="t">가변 축</span><span class="hint">opsz 14, wdth 90</span></div>
          <div class="fp-btn" style="padding:9px 13px"><span class="fp-name" style="font-size:14px;color:var(--ink-dim)">opsz 14, wdth 90</span><span class="fp-caret">↺</span></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
