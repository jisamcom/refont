<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shot.css"></head>
<body><div class="frame">
  <div class="panel">
    <span class="eyebrow">사이트별 제어</span>
    <div class="headline">사이트별로,<br><span class="hl">요소별로</span></div>
    <div class="sub">페이지가 실제로 쓰는 폰트를 보여 주고, 보호할지 직접 정합니다.</div>
    <div class="bul">
      <div><span class="dot"></span>특정 사이트 제외 · 단축키 Alt+Shift+F</div>
      <div><span class="dot"></span>특정 요소만 제외 (CSS 선택자)</div>
      <div><span class="dot"></span>'기능성/본문' 자동 분류 후 한 번에 보호</div>
    </div>
  </div>
  <div class="stagecol">
    <div class="popup">
      <div class="pop-head"><img src="../../public/icons/icon-128.png" alt=""><span class="nm">Re<b>font</b></span><span class="toggle"></span></div>
      <div class="body">
        <div>
          <div class="sec-h"><span class="t">보호 폰트</span><span class="hint">이 페이지에서 사용 중</span></div>
          <div class="chips">
            <div class="chip"><span class="cn" style="font-family:'Malgun Gothic',sans-serif">Font Awesome 6 Free</span><span class="tag fn">기능성</span><span class="plus">+</span></div>
            <div class="chip"><span class="cn" style="font-family:'Malgun Gothic',sans-serif">KaTeX_Math</span><span class="tag fn">기능성</span><span class="plus">+</span></div>
            <div class="chip"><span class="cn" style="font-family:'Malgun Gothic',sans-serif">Pretendard</span><span class="tag bd">본문</span><span class="plus">+</span></div>
          </div>
        </div>
        <div>
          <div class="sec-h"><span class="t">이 사이트 제외</span><span class="hint">news.example.com</span></div>
          <div class="fp-btn" style="padding:9px 13px"><span class="fp-name" style="font-size:14px;color:var(--ink-dim)">.price, table.specs 만 원래 폰트 유지</span><span class="fp-caret">＋</span></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
