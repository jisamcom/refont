<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shot.css"></head>
<body><div class="frame">
  <div class="panel">
    <div class="brand"><img src="../../public/icons/icon-128.png" alt=""><span class="wm">Re<b>font</b></span></div>
    <span class="eyebrow">웹폰트 강제 교체 · 기능성 폰트 보호</span>
    <div class="headline">웹의 모든 글꼴을<br><span class="hl">당신이 고른 폰트</span>로</div>
    <div class="sub">읽기 좋은 글꼴로 웹을 봅니다. 그러면서도 화면은 깨지지 않습니다.</div>
    <div class="bul">
      <div><span class="dot"></span>아이콘·수식·악보·이모지는 자동으로 보호</div>
      <div><span class="dot"></span>설치된 폰트 + 웹폰트(Google Fonts·직접 URL) 지원</div>
      <div><span class="dot"></span>추적 없음 · 설정은 내 기기에만 저장</div>
    </div>
  </div>
  <div class="stagecol">
    <div class="popup">
      <div class="pop-head"><img src="../../public/icons/icon-128.png" alt=""><span class="nm">Re<b>font</b></span><span class="toggle"></span></div>
      <div class="body">
        <div>
          <div class="sec-h"><span class="t">본문 글꼴</span><span class="hint">이 페이지에 적용 중</span></div>
          <div class="fp-btn"><span class="fp-name" style="font-family:'Nanum Myeongjo','Batang',serif">나눔명조</span><span class="fp-caret">▾</span></div>
        </div>
        <div class="specimen">
          <div class="sk" style="font-family:'Nanum Myeongjo','Batang',serif">다람쥐 헌 쳇바퀴에 타고파</div>
          <div class="se" style="font-family:'Nanum Myeongjo','Batang',serif">The quick brown fox jumps</div>
          <div class="sn" style="font-family:'Nanum Myeongjo','Batang',serif">0123456789 · ₩48,250</div>
        </div>
        <div class="row"><span class="lab">크기</span><span class="track"><span class="fill" style="width:36%"></span><span class="knob" style="left:36%"></span></span><span class="val">1.10×</span></div>
        <div class="row"><span class="lab">자간</span><span class="track"><span class="fill" style="width:22%"></span><span class="knob" style="left:22%"></span></span><span class="val">0.2px</span></div>
      </div>
    </div>
  </div>
</div></body></html>
