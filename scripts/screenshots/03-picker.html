<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="shot.css"></head>
<body><div class="frame">
  <div class="panel">
    <span class="eyebrow">폰트 선택</span>
    <div class="headline">한글 폰트는<br><span class="hl">한글 이름</span>으로</div>
    <div class="sub">검색하고, 미리 보고, 최근 쓴 폰트는 위에서 바로.</div>
    <div class="bul">
      <div><span class="dot"></span>각 항목이 실제 그 폰트로 미리 보기</div>
      <div><span class="dot"></span>한국어로 검색 (예: "나눔")</div>
      <div><span class="dot"></span>본문·코드 글꼴 따로 지정</div>
    </div>
  </div>
  <div class="stagecol">
    <div class="popup">
      <div class="pop-head"><img src="../../public/icons/icon-128.png" alt=""><span class="nm">본문 글꼴 선택</span></div>
      <div class="body" style="gap:6px">
        <div class="search"><span>🔍</span><span>폰트 검색…</span></div>
        <div class="fp-group">최근</div>
        <div class="fp-list">
          <div class="fp-opt sel"><span class="o-name" style="font-family:'Malgun Gothic',sans-serif">맑은 고딕</span><span class="o-sub">Malgun Gothic</span></div>
          <div class="fp-opt"><span class="o-name" style="font-family:Georgia,serif">Georgia</span><span class="o-sub">설치됨</span></div>
        </div>
        <div class="fp-group">전체</div>
        <div class="fp-list">
          <div class="fp-opt"><span class="o-name" style="font-family:'Batang',serif">바탕</span><span class="o-sub">Batang</span></div>
          <div class="fp-opt"><span class="o-name" style="font-family:'Gulim',sans-serif">굴림</span><span class="o-sub">Gulim</span></div>
          <div class="fp-opt"><span class="o-name" style="font-family:'Nanum Myeongjo','Batang',serif">나눔명조</span><span class="o-sub">Nanum Myeongjo</span></div>
          <div class="fp-opt"><span class="o-name" style="font-family:Verdana,sans-serif">Verdana</span><span class="o-sub">설치됨</span></div>
        </div>
      </div>
    </div>
  </div>
</div></body></html>
